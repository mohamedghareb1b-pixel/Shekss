<!--
  ============================================================
  COMPONENT: DEAL CARD
  components/deal-card.html
  ============================================================
  هذا ملف مرجعي يشرح بنية بطاقة العرض.
  الكود الفعلي موجود في: scripts/deals.js → dealCard()
  
  البنية:
  ┌─────────────────────────┐
  │  .dimg (صورة + badges)  │
  │    - badge-disc (%)      │
  │    - badge-hot           │
  │    - badge-offline       │
  │    - expired overlay     │
  │    - dimg-slider (opt.)  │
  ├─────────────────────────┤
  │  .dbody                  │
  │    - .dcat (قسم)         │
  │    - .store-name-badge   │
  │    - .dname              │
  │    - .ddesc              │
  │    - .dprice-wrap        │
  │    - .dist-badge         │
  │    - .deal-countdown     │
  │    - .coupon-wrap        │
  │    - .card-footer        │
  │        └ .btn-deal       │
  └─────────────────────────┘
  
  المتغيرات:
  - d         : بيانات العرض من Supabase
  - mode      : 'online' | 'offline'
  - isExpired : boolean (للعروض المنتهية)
  
  للاستخدام:
    dealCard(dealObject, 'online')
    dealCard(dealObject, 'offline', true)  // expired
  ============================================================
-->
