<script>
// ===========================
// تشغيل الموقع بعد تحميل الصفحة
// ===========================
document.addEventListener("DOMContentLoaded", () => {

  // الصفحة الافتراضية
  showPage("home");

  // قفل المينيو لو ضغط بره
  document.addEventListener("click", function(e) {
    const menu = document.getElementById("mob-menu");
    const btn = document.querySelector(".hamburger");

    if (!menu || !btn) return;

    if (
      menu.style.display === "block" &&
      !menu.contains(e.target) &&
      !btn.contains(e.target)
    ) {
      menu.style.display = "none";
    }
  });

});

// ===========================
// تبديل الصفحات
// ===========================
function showPage(pageId) {

  try {

    // إخفاء كل الصفحات
    const pages = document.querySelectorAll(".page");

    pages.forEach(page => {
      page.classList.remove("active");
    });

    // إظهار الصفحة المطلوبة
    const targetPage = document.getElementById("page-" + pageId);

    if (targetPage) {
      targetPage.classList.add("active");
    } else {
      console.warn("الصفحة غير موجودة:", pageId);
      return;
    }

    // تحديث الـ navbar
    const navLinks = document.querySelectorAll(".nav-links a");

    navLinks.forEach(link => {
      link.classList.remove("active");
    });

    const activeLink = document.getElementById("nav-" + pageId);

    if (activeLink) {
      activeLink.classList.add("active");
    }

    // قفل قائمة الموبايل
    const mobMenu = document.getElementById("mob-menu");

    if (mobMenu) {
      mobMenu.style.display = "none";
    }

    // Scroll للأعلى
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } catch (error) {
    console.error("خطأ في showPage:", error);
  }
}

// ===========================
// قائمة الموبايل
// ===========================
function toggleMob() {

  try {

    const menu = document.getElementById("mob-menu");

    if (!menu) return;

    if (menu.style.display === "block") {
      menu.style.display = "none";
    } else {
      menu.style.display = "block";
    }

  } catch (error) {
    console.error("خطأ في toggleMob:", error);
  }
}

// ===========================
// Toast Notification
// ===========================
function showToast(message = "تم بنجاح ✅") {

  let toast = document.querySelector(".toast");

  // إنشاء التوست لو مش موجود
  if (!toast) {
    toast = document.createElement("div");
    toast.className = "toast";
    document.body.appendChild(toast);
  }

  toast.innerHTML = `
    <span>✅</span>
    <span>${message}</span>
  `;

  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);
}

// ===========================
// أزرار Claim Offer
// ===========================
document.addEventListener("click", function(e) {

  if (e.target.classList.contains("btn-claim")) {

    e.preventDefault();

    showToast("تم حفظ العرض بنجاح 🔥");

  }

});

// ===========================
// حماية من الأخطاء العامة
// ===========================
window.onerror = function(message, source, lineno, colno, error) {

  console.error("Global Error:", {
    message,
    source,
    lineno,
    colno,
    error
  });

  return true;
};
</script>
