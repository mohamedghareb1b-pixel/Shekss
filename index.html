<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شيكس - عالم الخصومات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --bg: #f8fafc; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
        body { background: var(--bg); }
        
        header { background: var(--dark); color: white; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        /* تصميم كروت العروض */
        .deals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .deal-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .deal-card:hover { transform: translateY(-5px); }
        .deal-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .deal-info { padding: 20px; }
        .deal-badge { background: #ff4757; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .deal-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 5px; color: var(--dark); }
        .deal-loc { color: #64748b; font-size: 0.9rem; margin-bottom: 15px; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        .btn-online { background: var(--blue); color: white; }
        .btn-map { background: #f1f5f9; color: var(--dark); border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<header>
    <h1>Shekss - شيكس</h1>
    <p>أقوى العروض والخصومات في مكان واحد</p>
</header>

<div class="container">
    <h2 style="margin-bottom: 25px;">🔥 أحدث العروض</h2>
    <div id="deals-container" class="deals-grid">
        <p style="text-align: center; grid-column: 1/-1;">جاري تحميل العروض...</p>
    </div>
</div>

<script>
    // ربط سوبابيز (نفس المفاتيح اللي استخدمناها في الـ Admin)
    const SUPABASE_URL = 'https://xxsmdktshnysesxawyjq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4c21ka3RzaG55c2VzeGF3eWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTU5MzksImV4cCI6MjA5MzkzMTkzOX0.KSf4cZhLtliwu_AhqYGIQADeTJ5g121DqRmncYfXV3g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadDeals() {
        const { data: deals, error } = await _supabase
            .from('deals')
            .select('*')
            .order('created_at', { ascending: false });

        const container = document.getElementById('deals-container');
        
        if (error) {
            container.innerHTML = `<p>حدث خطأ أثناء تحميل العروض: ${error.message}</p>`;
            return;
        }

        if (deals.length === 0) {
            container.innerHTML = `<p style="text-align: center; grid-column: 1/-1;">لا توجد عروض متاحة حالياً.</p>`;
            return;
        }

        container.innerHTML = ''; // مسح كلمة "جاري التحميل"
        
        deals.forEach(deal => {
            container.innerHTML += `
                <div class="deal-card">
                    <img class="deal-img" src="${deal.image || 'https://via.placeholder.com/300x200?text=Shekss'}" alt="${deal.name}">
                    <div class="deal-info">
                        <span class="deal-badge">خصم ${deal.discount}%</span>
                        <h3 class="deal-title">${deal.name}</h3>
                        <p class="deal-loc">📍 ${deal.governorate} - ${deal.city}</p>
                        <p style="font-size: 0.85rem; color: #444; margin-bottom: 15px;">${deal.description || ''}</p>
                        
                        <div class="btn-group">
                            ${deal.online_link ? `<a href="${deal.online_link}" target="_blank" class="btn btn-online">شراء أونلاين</a>` : ''}
                            ${deal.map_link ? `<a href="${deal.map_link}" target="_blank" class="btn btn-map">الموقع</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // تشغيل الجلب عند التحميل
    window.onload = loadDeals;
</script>

</body>
</html>
