<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم شيكس - Shekss Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --bg: #f8fafc; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
        body { background: var(--bg); display: flex; min-height: 100vh; direction: rtl; }
        .sidebar { width: 260px; background: var(--dark); color: white; position: fixed; right: 0; height: 100vh; padding: 25px; }
        .nav-btn { width: 100%; padding: 14px; background: none; border: none; color: #94a3b8; text-align: right; cursor: pointer; border-radius: 10px; margin-bottom: 10px; font-weight: 700; transition: 0.3s; }
        .nav-btn.active { background: var(--blue); color: white; }
        .main { margin-right: 260px; flex: 1; padding: 40px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #475569; }
        input, select, textarea { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; outline: none; }
        .btn-save { background: var(--blue); color: white; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: 800; width: 100%; font-size: 16px; }
        .img-preview { width: 100px; height: 100px; border-radius: 10px; object-fit: cover; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<aside class="sidebar">
    <h2 style="color:#38bdf8; text-align:center; margin-bottom:30px">Shekss Admin</h2>
    <button class="nav-btn active" onclick="showTab('deals-tab', this)">🛍️ إدارة العروض</button>
    <button class="nav-btn" onclick="showTab('blogs-tab', this)">📝 إدارة المدونة</button>
</aside>

<main class="main">
    <div id="deals-tab" class="tab-content active">
        <h1>إدارة عروض الخصم</h1>
        <div class="card">
            <div class="form-grid">
                <div class="form-group"><label>اسم المحل</label><input type="text" id="d-name"></div>
                <div class="form-group"><label>نسبة الخصم %</label><input type="number" id="d-discount"></div>
                <div class="form-group"><label>المحافظة</label><select id="d-gov"></select></div>
                <div class="form-group"><label>المركز</label><select id="d-city"></select></div>
                <div class="form-group"><label>لينك الشراء (أونلاين)</label><input type="text" id="d-online"></div>
                <div class="form-group"><label>رابط الخريطة (أوفلاين)</label><input type="text" id="d-map"></div>
            </div>
            <div class="form-group"><label>وصف العرض</label><textarea id="d-desc"></textarea></div>
            <div class="form-group">
                <label>صورة العرض (أساسية)</label>
                <input type="file" accept="image/*" id="d-file-input">
                <img id="d-preview" class="img-preview">
                <input type="hidden" id="d-img-data">
            </div>
            <button class="btn-save" onclick="saveDeal()">حفظ العرض</button>
        </div>
    </div>

    <div id="blogs-tab" class="tab-content">
        <h1>إدارة المدونة</h1>
        <div class="card">
            <div class="form-group"><label>عنوان المقال</label><input type="text" id="b-title"></div>
            <div class="form-group"><label>المحتوى</label><textarea id="b-content" style="height:200px"></textarea></div>
            <div class="form-group">
                <label>صورة الغلاف</label>
                <input type="file" accept="image/*" id="b-file-input">
                <img id="b-preview" class="img-preview">
                <input type="hidden" id="b-img-data">
            </div>
            <button class="btn-save" style="background:#10b981" onclick="saveBlog()">نشر المقال</button>
        </div>
    </div>
</main>

<script>
    const SUPABASE_URL = 'https://xxsmdktshnysesxawyjq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4c21ka3RzaG55c2VzeGF3eWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTU5MzksImV4cCI6MjA5MzkzMTkzOX0.KSf4cZhLtliwu_AhqYGIQADeTJ5g121DqRmncYfXV3g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const egyptData = {
        "القاهرة": ["مدينة نصر", "المعادي", "التجمع"],
        "الشرقية": ["فاقوس", "الزقازيق", "أبو حماد"],
        "الأسكندرية": ["سموحة", "الرمل"],
        "الجيزة": ["الدقي", "أكتوبر"]
    };

    function initGov() {
        const govSel = document.getElementById('d-gov');
        if(!govSel) return;
        govSel.innerHTML = '<option value="">اختر محافظة</option>';
        Object.keys(egyptData).forEach(g => {
            govSel.innerHTML += `<option value="${g}">${g}</option>`;
        });
        
        govSel.onchange = function() {
            const citySel = document.getElementById('d-city');
            citySel.innerHTML = '';
            if(egyptData[this.value]) {
                egyptData[this.value].forEach(c => {
                    citySel.innerHTML += `<option value="${c}">${c}</option>`;
                });
            }
        };
    }

    // معالجة الصور
    function handleImage(inputId, hiddenId, previewId) {
        const input = document.getElementById(inputId);
        input.onchange = function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(hiddenId).value = e.target.result;
                    const preview = document.getElementById(previewId);
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(this.files[0]);
            }
        };
    }

    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    async function saveDeal() {
        const img = document.getElementById('d-img-data').value;
        if(!img) return alert("الرجاء اختيار صورة!");
        
        const { error } = await _supabase.from('deals').insert([{
            name: document.getElementById('d-name').value,
            discount: parseInt(document.getElementById('d-discount').value) || 0,
            governorate: document.getElementById('d-gov').value,
            city: document.getElementById('d-city').value,
            description: document.getElementById('d-desc').value,
            online_link: document.getElementById('d-online').value,
            map_link: document.getElementById('d-map').value,
            image: img,
            status: 'active'
        }]);
        
        if(error) alert("خطأ: " + error.message);
        else { alert("تم حفظ العرض!"); location.reload(); }
    }

    async function saveBlog() {
        const img = document.getElementById('b-img-data').value;
        if(!img) return alert("الرجاء اختيار صورة!");

        const { error } = await _supabase.from('blogs').insert([{
            title: document.getElementById('b-title').value,
            content: document.getElementById('b-content').value,
            image: img,
            author: 'Mohamed Gharib'
        }]);
        
        if(error) alert("خطأ: " + error.message);
        else { alert("تم نشر المقال!"); location.reload(); }
    }

    window.onload = function() {
        initGov();
        handleImage('d-file-input', 'd-img-data', 'd-preview');
        handleImage('b-file-input', 'b-img-data', 'b-preview');
    };
</script>
</body>
</html>
