<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shekss Admin - لوحة التحكم المتكاملة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --bg: #f1f5f9; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
        body { background: var(--bg); display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--dark); color: white; position: fixed; right: 0; height: 100vh; padding: 20px; }
        .sidebar h2 { font-weight: 900; margin-bottom: 30px; text-align: center; color: #38bdf8; }
        .nav-btn { width: 100%; padding: 12px; background: none; border: none; color: #94a3b8; text-align: right; cursor: pointer; border-radius: 8px; margin-bottom: 5px; font-weight: 700; transition: 0.3s; }
        .nav-btn.active { background: var(--blue); color: white; }

        /* Main Content */
        .main { margin-right: 260px; flex: 1; padding: 30px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Forms & UI */
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 700; color: #334155; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        textarea { height: 100px; resize: vertical; }
        .btn-save { background: var(--blue); color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 800; width: 100%; margin-top: 10px; }
        
        /* Table */
        table { width: 100%; background: white; border-radius: 10px; overflow: hidden; border-collapse: collapse; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #64748b; }
        .preview-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #eee; }
    </style>
</head>
<body>

<aside class="sidebar">
    <h2>Shekss Admin</h2>
    <button class="nav-btn active" onclick="showTab('deals-tab', this)">🛍️ إدارة العروض</button>
    <button class="nav-btn" onclick="showTab('blogs-tab', this)">📝 إدارة المدونة</button>
</aside>

<main class="main">
    <div id="deals-tab" class="tab-content active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
            <h1>إدارة عروض الخصم</h1>
        </div>

        <div class="card">
            <h3 style="margin-bottom:15px">إضافة عرض جديد</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم العرض (المحل/البراند)</label>
                    <input type="text" id="d-name">
                </div>
                <div class="form-group">
                    <label>نسبة الخصم (%)</label>
                    <input type="number" id="d-discount">
                </div>
                <div class="form-group">
                    <label>المحافظة</label>
                    <select id="d-gov" onchange="updateCities('d-gov', 'd-city')"></select>
                </div>
                <div class="form-group">
                    <label>المركز/المدينة</label>
                    <select id="d-city"><option>اختر المحافظة أولاً</option></select>
                </div>
            </div>
            <div class="form-group">
                <label>وصف المنتج / تفاصيل العرض</label>
                <textarea id="d-desc" placeholder="اشرح تفاصيل العرض والمنتجات المتاحة..."></textarea>
            </div>
            <div class="form-group">
                <label>صورة اللوجو/المنتج</label>
                <input type="file" accept="image/*" onchange="processImage(this, 'd-img-data')">
                <input type="hidden" id="d-img-data">
            </div>
            <button class="btn-save" onclick="saveDeal()">حفظ ونشر العرض</button>
        </div>
    </div>

    <div id="blogs-tab" class="tab-content">
        <h1>إدارة مقالات المدونة</h1>
        <div class="card">
            <h3 style="margin-bottom:15px">كتابة مقال جديد</h3>
            <div class="form-group">
                <label>عنوان المقال</label>
                <input type="text" id="b-title" placeholder="أدخل عنواناً جذاباً...">
            </div>
            <div class="form-group">
                <label>محتوى المقال</label>
                <textarea id="b-content" style="height:200px" placeholder="اكتب موضوع المقال هنا..."></textarea>
            </div>
            <div class="form-group">
                <label>صورة المقال</label>
                <input type="file" accept="image/*" onchange="processImage(this, 'b-img-data')">
                <input type="hidden" id="b-img-data">
            </div>
            <button class="btn-save" style="background:#10b981" onclick="saveBlog()">نشر المقال الآن</button>
        </div>
    </div>
</main>

<script>
    // إعدادات سوبابيز
    const SUPABASE_URL = 'https://xxsmdktshnysesxawyjq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4c21ka3RzaG55c2VzeGF3eWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTU5MzksImV4cCI6MjA5MzkzMTkzOX0.KSf4cZhLtliwu_AhqYGIQADeTJ5g121DqRmncYfXV3g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // بيانات محافظات مصر
    const egyptData = {
        "القاهرة": ["مدينة نصر", "المعادي", "حلوان", "التجمع"], "الجيزة": ["الدقي", "أكتوبر", "الهرم"],
        "الشرقية": ["فاقوس", "الزقازيق", "بلبيس", "أبو حماد"], "الدقهلية": ["المنصورة", "ميت غمر"],
        "الأسكندرية": ["الرمل", "سموحة", "المنتزة"], "الغربية": ["طنطا", "المحلة"],
        "المنوفية": ["شبين الكوم", "قويسنا"], "البحيرة": ["دمنهور", "كفر الدوار"],
        "كفر الشيخ": ["كفر الشيخ", "دسوق"], "دمياط": ["دمياط", "رأس البر"],
        "بورسعيد": ["حي الشرق", "بورفؤاد"], "الإسماعيلية": ["الإسماعيلية", "القنطرة"],
        "السويس": ["حي السويس"], "الفيوم": ["الفيوم"], "بني سويف": ["بني سويف"],
        "المنيا": ["المنيا"], "أسيوط": ["أسيوط"], "سوهاج": ["سوهاج"], "قنا": ["قنا"],
        "الأقصر": ["الأقصر"], "أسوان": ["أسوان"], "مطروح": ["مرسى مطروح"],
        "البحر الأحمر": ["الغردقة"], "جنوب سيناء": ["شرم الشيخ"]
    };

    // تعبئة المحافظات
    function initGov() {
        const sel = document.getElementById('d-gov');
        sel.innerHTML = '<option value="">اختر المحافظة</option>';
        Object.keys(egyptData).forEach(g => sel.innerHTML += `<option value="${g}">${g}</option>`);
    }

    function updateCities(govId, cityId) {
        const gov = document.getElementById(govId).value;
        const citySel = document.getElementById(cityId);
        citySel.innerHTML = '';
        if(egyptData[gov]) egyptData[gov].forEach(c => citySel.innerHTML += `<option value="${c}">${c}</option>`);
    }

    // معالجة الصور
    function processImage(input, hiddenId) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById(hiddenId).value = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    // التنقل بين التبويبات
    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // حفظ العرض
    async function saveDeal() {
        const data = {
            name: document.getElementById('d-name').value,
            governorate: document.getElementById('d-gov').value,
            city: document.getElementById('d-city').value,
            discount: parseInt(document.getElementById('d-discount').value),
            description: document.getElementById('d-desc').value,
            image: document.getElementById('d-img-data').value,
            status: 'active'
        };
        const { error } = await _supabase.from('deals').insert([data]);
        if(error) alert(error.message); else { alert("تم حفظ العرض!"); location.reload(); }
    }

    // حفظ البلوج
    async function saveBlog() {
        const data = {
            title: document.getElementById('b-title').value,
            content: document.getElementById('b-content').value,
            image: document.getElementById('b-img-data').value,
            author: 'Mohamed Gharib'
        };
        const { error } = await _supabase.from('blogs').insert([data]);
        if(error) alert(error.message); else { alert("تم نشر المقال!"); location.reload(); }
    }

    window.onload = initGov;
</script>
</body>
</html>
