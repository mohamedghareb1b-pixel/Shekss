<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم شيكس - Shekss Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; --bg: #f8fafc; --white: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
        body { background: var(--bg); display: flex; min-height: 100vh; direction: rtl; }
        
        /* القائمة الجانبية */
        .sidebar { width: 260px; background: var(--dark); color: white; position: fixed; right: 0; height: 100vh; padding: 25px; box-shadow: -2px 0 10px rgba(0,0,0,0.1); }
        .sidebar h2 { font-weight: 900; margin-bottom: 40px; text-align: center; color: #38bdf8; font-size: 24px; }
        .nav-btn { width: 100%; padding: 14px; background: none; border: none; color: #94a3b8; text-align: right; cursor: pointer; border-radius: 10px; margin-bottom: 10px; font-weight: 700; transition: 0.3s; font-size: 16px; }
        .nav-btn.active { background: var(--blue); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .nav-btn:hover:not(.active) { background: rgba(255,255,255,0.05); color: white; }

        /* المحتوى الرئيسي */
        .main { margin-right: 260px; flex: 1; padding: 40px; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* الكروت والفورم */
        .card { background: var(--white); padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 30px; border: 1px solid #eef2f6; }
        h1 { font-weight: 800; color: var(--dark); margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #475569; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px 15px; border: 1.5px solid #e2e8f0; border-radius: 10px; outline: none; transition: 0.3s; font-size: 15px; }
        input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        textarea { height: 120px; }
        .btn-save { background: var(--blue); color: white; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: 800; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn-save:hover { background: #1d4ed8; transform: translateY(-2px); }
        
        .img-preview-container { margin-top: 10px; display: none; }
        .img-preview { width: 100px; height: 100px; border-radius: 10px; object-fit: cover; border: 2px solid var(--blue); }
    </style>
</head>
<body>

<aside class="sidebar">
    <h2>Shekss Admin</h2>
    <button class="nav-btn active" onclick="showTab('deals-tab', this)">🛍️ إدارة العروض</button>
    <button class="nav-btn" onclick="showTab('blogs-tab', this)">📝 إدارة المدونة</button>
</aside>

<main class="main">
    <div id="deals-tab" class="tab-content active">
        <h1>إدارة عروض الخصم</h1>
        <div class="card">
            <h3 style="margin-bottom:20px; color:var(--blue)">+ إضافة عرض جديد</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم المحل / العلامة التجارية</label>
                    <input type="text" id="d-name" placeholder="مثلاً: كافيه شيكس">
                </div>
                <div class="form-group">
                    <label>نسبة الخصم (%)</label>
                    <input type="number" id="d-discount" placeholder="مثلاً: 25">
                </div>
                <div class="form-group">
                    <label>المحافظة</label>
                    <select id="d-gov" onchange="updateCities('d-gov', 'd-city')"></select>
                </div>
                <div class="form-group">
                    <label>المركز / المدينة</label>
                    <select id="d-city"><option>اختر المحافظة أولاً</option></select>
                </div>
            </div>
            <div class="form-group">
                <label>وصف المنتج وتفاصيل العرض</label>
                <textarea id="d-desc" placeholder="اكتب هنا ما يشمله الخصم بالتفصيل..."></textarea>
            </div>
            <div class="form-group">
                <label>صورة العرض أو اللوجو</label>
                <input type="file" accept="image/*" onchange="processImage(this, 'd-img-data', 'd-preview-ui')">
                <div id="d-preview-ui" class="img-preview-container">
                    <img id="d-preview-img" class="img-preview">
                </div>
                <input type="hidden" id="d-img-data">
            </div>
            <button class="btn-save" onclick="saveDeal()">حفظ ونشر العرض الآن</button>
        </div>
    </div>

    <div id="blogs-tab" class="tab-content">
        <h1>إدارة مقالات المدونة</h1>
        <div class="card">
            <h3 style="margin-bottom:20px; color:#10b981">+ كتابة مقال جديد</h3>
            <div class="form-group">
                <label>عنوان المقال</label>
                <input type="text" id="b-title" placeholder="
