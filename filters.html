<!--
  ============================================================
  COMPONENT: FILTERS
  components/filters.html
  ============================================================
  يشمل: mode-toggle / categories / subcategories / sort-bar / location-fallback
  الكود الفعلي موجود في: scripts/deals.js + scripts/nav-location.js
  ============================================================
-->

<!--
  ── MODE TOGGLE ──────────────────────────────────────────────
  للتبديل بين أونلاين وجمبي.
  الـ ID يتغير حسب السياق: home-mode-*, deals-mode-*, expired-mode-*

  <div class="mode-toggle">
    <button class="mode-btn active" id="{ctx}-mode-online" onclick="{ctx}SetMode('online')">🌐 أونلاين</button>
    <button class="mode-btn"        id="{ctx}-mode-offline" onclick="{ctx}SetMode('offline')">📍 جمبي</button>
  </div>

  ── CATEGORIES SCROLL ────────────────────────────────────────
  يُبنى ديناميكياً من ONLINE_CATS / OFFLINE_CATS في data.js
  
  <div class="cats-scroll" id="{ctx}-cats"></div>

  ── SUBCATEGORIES ────────────────────────────────────────────
  يظهر عند اختيار قسم له أقسام فرعية
  
  <div class="subcats" id="{ctx}-subcats"></div>

  ── SORT BAR ─────────────────────────────────────────────────
  <div class="sort-bar">
    <span class="sort-label">ترتيب:</span>
    <button class="sort-btn active" onclick="{ctx}SetSort('newest',this)">الأحدث</button>
    <button class="sort-btn"        onclick="{ctx}SetSort('discount',this)">أعلى خصم</button>
    <button class="sort-btn"        onclick="{ctx}SetSort('price_asc',this)">أقل سعر</button>
  </div>

  ── LOCATION FALLBACK (جمبي فقط) ─────────────────────────────
  يظهر عند تفعيل وضع جمبي

  <div id="{ctx}-loc-fallback" style="display:none;">
    <select id="{ctx}-gov-select"  onchange="onGovChange('{ctx}')">...</select>
    <select id="{ctx}-city-select" onchange="onCityChange('{ctx}')">...</select>
  </div>

  ── السياقات المدعومة ──────────────────────────────────────
  ctx = 'home'    → الرئيسية
  ctx = 'deals'   → صفحة العروض
  ctx = 'expired' → صفحة العروض المنتهية (بدون location fallback)
-->
